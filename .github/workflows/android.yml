name: Android CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ ابحث عن icons.zip في أي مكان + اطبع محتواه + ثبّت ic_launcher/ic_launcher_round
      - name: Restore launcher icons (search + debug)
        run: |
          echo "===== البحث عن icons.zip داخل المشروع ====="
          ICON_ZIP=$(find . -maxdepth 4 -type f -iname "icons.zip" | head -n 1 || true)

          if [ -z "$ICON_ZIP" ]; then
            echo "❌ لم أجد icons.zip داخل المشروع."
            echo "✅ الحل: ارفع icons.zip إلى جذر المشروع (root) أو داخل أي مجلد قريب."
            echo "مساعدة: الملفات الموجودة في الجذر:"
            ls -la
            exit 1
          fi

          echo "✅ تم العثور على: $ICON_ZIP"

          rm -rf /tmp/icons_unzip
          mkdir -p /tmp/icons_unzip
          unzip -o "$ICON_ZIP" -d /tmp/icons_unzip

          echo "===== عرض ملفات مهمة داخل zip (ic_launcher) ====="
          find /tmp/icons_unzip -type f -name "ic_launcher*.png" -o -name "ic_launcher*.webp" | head -n 50 || true
          echo "===== عرض أول 200 ملف داخل zip ====="
          find /tmp/icons_unzip -type f | head -n 200 || true
          echo "==============================================="

          # ابحث عن أيقونة launcher بأي امتداد (png/webp)
          ICON_MAIN=$(find /tmp/icons_unzip -type f \( -name "ic_launcher.png" -o -name "ic_launcher.webp" \) | head -n 1 || true)
          ICON_ROUND=$(find /tmp/icons_unzip -type f \( -name "ic_launcher_round.png" -o -name "ic_launcher_round.webp" \) | head -n 1 || true)

          if [ -z "$ICON_MAIN" ] || [ -z "$ICON_ROUND" ]; then
            echo "❌ لم أجد ic_launcher و/أو ic_launcher_round داخل zip."
            echo "✅ المطلوب داخل zip: ملفات باسم ic_launcher.png و ic_launcher_round.png (أو webp)."
            exit 1
          fi

          echo "✅ ic_launcher: $ICON_MAIN"
          echo "✅ ic_launcher_round: $ICON_ROUND"

          # أنشئ مجلدات mipmap داخل المشروع إن لم تكن موجودة
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
          done

          # انسخ الأيقونات لجميع الدقات (بدون تقليل الدقة - نفس الملف كما هو)
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp -f "$ICON_MAIN"  "app/src/main/res/$d/ic_launcher.png"  || true
            cp -f "$ICON_ROUND" "app/src/main/res/$d/ic_launcher_round.png" || true
          done

          echo "===== تأكيد وجود الأيقونات داخل res ====="
          find app/src/main/res -maxdepth 2 -type f -name "ic_launcher*.png" -print || true

          # تحقق نهائي قبل البناء
          if [ ! -f "app/src/main/res/mipmap-mdpi/ic_launcher.png" ] && \
             [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ] && \
             [ ! -f "app/src/main/res/mipmap-xhdpi/ic_launcher.png" ] && \
             [ ! -f "app/src/main/res/mipmap-xxhdpi/ic_launcher.png" ] && \
             [ ! -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            echo "❌ ما زالت ic_launcher.png غير موجودة في mipmap-* داخل المشروع."
            exit 1
          fi

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mashaf-release-apk
          path: app/build/outputs/apk/release/*.apk