name: Android CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ فحص سريع للأيقونات (مهم جداً لأن كثير من أعطال AAPT2 تأتي من PNG/WebP غير صالح)
      - name: Check launcher icons exist + show info
        run: |
          echo "===== فحص وجود أيقونات launcher ====="
          find app/src/main/res -maxdepth 2 -type f -name "ic_launcher.*" -print || true
          find app/src/main/res -maxdepth 2 -type f -name "ic_launcher_round.*" -print || true
          echo "===== معلومات الملفات (file) ====="
          for f in $(find app/src/main/res -maxdepth 2 -type f \( -name "ic_launcher.*" -o -name "ic_launcher_round.*" \)); do
            echo "---- $f ----"
            ls -lh "$f" || true
            file "$f" || true
          done
          echo "===================================="

      # ✅ بناء مع إخراج مفصّل + stacktrace لكي يظهر السبب الحقيقي
      - name: Build Release APK (verbose)
        run: |
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon assembleRelease --stacktrace --info

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mashaf-release-apk
          path: app/build/outputs/apk/release/*.apk