name: Build APK

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Restore launcher icons from icons.zip
        shell: bash
        run: |
          set -e

          ZIP_PATH="app/src/main/res/icons.zip"
          [ -f "$ZIP_PATH" ] || (echo "ERROR: icons.zip not found at $ZIP_PATH"; exit 1)

          TMP_DIR="$(mktemp -d)"
          unzip -o "$ZIP_PATH" -d "$TMP_DIR" >/dev/null

          # اكتشاف مكان مجلدات mipmap داخل الملف المضغوط حتى لو كان داخل مجلدات إضافية
          MIPMAP_MDPI="$(find "$TMP_DIR" -type d -name mipmap-mdpi | head -n 1)"
          [ -n "$MIPMAP_MDPI" ] || (echo "ERROR: mipmap-mdpi not found inside icons.zip"; exit 1)
          SRC_ROOT="$(dirname "$MIPMAP_MDPI")"

          echo "== Removing old launcher icon resources =="
          rm -rf app/src/main/res/mipmap-* || true
          rm -rf app/src/main/res/mipmap-anydpi-v26 || true

          echo "== Copying new mipmap folders =="
          cp -R "$SRC_ROOT"/mipmap-* app/src/main/res/

          echo "== Verifying ic_launcher files exist =="
          find app/src/main/res -maxdepth 2 -type f -name "ic_launcher*" -print || true
          find app/src/main/res -type f -path "*/mipmap-*/ic_launcher.*" | head -n 20

          rm -f "$ZIP_PATH"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk