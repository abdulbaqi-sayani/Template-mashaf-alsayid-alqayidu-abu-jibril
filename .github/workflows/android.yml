name: Android CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Restore launcher icons from icons.zip (smart)
        run: |
          set -e

          echo "===== البحث عن icons.zip داخل المشروع ====="
          ICON_ZIP=$(find . -type f -iname "icons.zip" | head -n 1 || true)

          if [ -z "$ICON_ZIP" ]; then
            echo "❌ لم أجد icons.zip داخل المشروع."
            echo "✅ ارفعه إلى الجذر أو داخل app/src/main/res/"
            echo "مساعدة: عرض ملفات الجذر:"
            ls -la
            exit 1
          fi

          echo "✅ تم العثور على: $ICON_ZIP"

          rm -rf /tmp/icons_unzip
          mkdir -p /tmp/icons_unzip
          unzip -o "$ICON_ZIP" -d /tmp/icons_unzip

          echo "===== عرض مجلدات داخل zip ====="
          find /tmp/icons_unzip -maxdepth 3 -type d | head -n 80 || true

          echo "===== البحث عن مجلدات mipmap-* داخل zip ====="
          MM_DIRS=$(find /tmp/icons_unzip -type d -name "mipmap-*" | head -n 50 || true)

          DEST="app/src/main/res"
          mkdir -p "$DEST"

          if echo "$MM_DIRS" | grep -q "mipmap-"; then
            echo "✅ وجدت مجلدات mipmap-* داخل zip — سيتم نسخها كما هي (أفضل خيار)"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              base=$(basename "$d")
              echo "Copy: $d -> $DEST/$base"
              rm -rf "$DEST/$base"
              cp -r "$d" "$DEST/"
            done <<< "$MM_DIRS"
          else
            echo "⚠️ لم أجد مجلدات mipmap-* داخل zip — سأستخدم fallback بنسخ ic_launcher مباشرة"
            ICON_MAIN=$(find /tmp/icons_unzip -type f \( -name "ic_launcher.png" -o -name "ic_launcher.webp" \) | head -n 1 || true)
            ICON_ROUND=$(find /tmp/icons_unzip -type f \( -name "ic_launcher_round.png" -o -name "ic_launcher_round.webp" \) | head -n 1 || true)

            if [ -z "$ICON_MAIN" ] || [ -z "$ICON_ROUND" ]; then
              echo "❌ لم أجد ic_launcher و/أو ic_launcher_round داخل zip."
              echo "✅ المطلوب داخل zip: ic_launcher.png و ic_launcher_round.png (أو webp)"
              exit 1
            fi

            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$DEST/$d"
            done

            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "$ICON_MAIN"  "$DEST/$d/ic_launcher.png" || true
              cp -f "$ICON_ROUND" "$DEST/$d/ic_launcher_round.png" || true
            done
          fi

          echo "===== تأكيد وجود الأيقونات داخل res ====="
          find "$DEST" -maxdepth 2 -type f -name "ic_launcher*.png" -o -name "ic_launcher*.webp" | head -n 100 || true

          if ! find "$DEST" -type f -path "*mipmap-*/ic_launcher.*" | grep -q .; then
            echo "❌ ic_launcher غير موجود بعد الاسترجاع."
            exit 1
          fi

          if ! find "$DEST" -type f -path "*mipmap-*/ic_launcher_round.*" | grep -q .; then
            echo "❌ ic_launcher_round غير موجود بعد الاسترجاع."
            exit 1
          fi

          echo "✅ تم استرجاع الأيقونات بنجاح"

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mashaf-release-apk
          path: app/build/outputs/apk/release/*.apk