name: Android CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      # استرجاع الأيقونات إذا موجود icons.zip
      - name: Restore launcher icons from icons.zip
        if: hashFiles('icons.zip') != ''
        run: |
          unzip -o icons.zip -d app/src/main/res/

      # 🔥 هنا الفرق الحقيقي
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mashaf-release-apk
          path: app/build/outputs/apk/release/*.apk